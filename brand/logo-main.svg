<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d77a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4a84b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#09090d;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#d4a84b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="url(#darkGrad)" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Magnifying glass body -->
  <circle cx="175" cy="170" r="80" fill="none" stroke="url(#goldGrad)" stroke-width="10" filter="url(#glow)" />

  <!-- Glass inner highlight -->
  <circle cx="175" cy="170" r="65" fill="none" stroke="#d4a84b" stroke-width="1.5" opacity="0.3" />

  <!-- Handle -->
  <line x1="235" y1="230" x2="300" y2="295" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)" />

  <!-- Graph bars inside magnifying glass -->
  <rect x="130" y="195" width="18" height="35" rx="3" fill="#d4a84b" opacity="0.7" />
  <rect x="155" y="175" width="18" height="55" rx="3" fill="#d4a84b" opacity="0.85" />
  <rect x="180" y="155" width="18" height="75" rx="3" fill="url(#goldGrad)" />
  <rect x="205" y="170" width="18" height="60" rx="3" fill="#d4a84b" opacity="0.75" />

  <!-- Upward arrow -->
  <path d="M165 140 L185 115 L205 140" fill="none" stroke="#f5d77a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <line x1="185" y1="115" x2="185" y2="148" stroke="#f5d77a" stroke-width="5" stroke-linecap="round" />

  <!-- Small nodes/dots for network effect -->
  <circle cx="120" cy="130" r="4" fill="#f5d77a" opacity="0.6" />
  <circle cx="230" cy="125" r="4" fill="#f5d77a" opacity="0.6" />
  <circle cx="145" cy="105" r="3" fill="#d4a84b" opacity="0.4" />
  <circle cx="210" cy="100" r="3" fill="#d4a84b" opacity="0.4" />

  <!-- Connection lines -->
  <line x1="120" y1="130" x2="145" y2="105" stroke="#d4a84b" stroke-width="1" opacity="0.3" />
  <line x1="145" y1="105" x2="185" y2="115" stroke="#d4a84b" stroke-width="1" opacity="0.3" />
  <line x1="185" y1="115" x2="210" y2="100" stroke="#d4a84b" stroke-width="1" opacity="0.3" />
  <line x1="210" y1="100" x2="230" y2="125" stroke="#d4a84b" stroke-width="1" opacity="0.3" />

  <!-- Text: SEO -->
  <text x="200" y="340" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="52" fill="url(#goldGrad)" letter-spacing="8" filter="url(#shadow)">SEO</text>

  <!-- Text: TOOLS -->
  <text x="200" y="375" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="300" font-size="28" fill="#8a8999" letter-spacing="12">TOOLS</text>
</svg>
